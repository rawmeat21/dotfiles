[mgr]
cwd = { fg = "#e5383b", bold = true }
hovered = { fg = "#000000", bg = "#c1121f" }
preview_hovered = { underline = true }
find_keyword = { fg = "#ff6b6b", bold = true }
find_position = { fg = "#e5383b" }
marker_copied = { fg = "#7a1f1f", bg = "#7a1f1f" }
marker_cut = { fg = "#e5383b", bg = "#e5383b" }
marker_marked = { fg = "#ff6b6b", bg = "#ff6b6b" }
marker_selected = { fg = "#e5383b", bg = "#e5383b" }
count_copied = { fg = "#000000", bg = "#a8a8a8" }
count_cut = { fg = "#000000", bg = "#7a1f1f" }
count_selected = { fg = "#000000", bg = "#e5383b" }
border_symbol = "│"
border_style = { fg = "#5c1a1a" }

[mode]
normal_main = { fg = "#000000", bg = "#e5383b", bold = true }
normal_alt  = { fg = "#e5383b", bg = "#1a1a1a" }
select_main = { fg = "#000000", bg = "#ff6b6b", bold = true }
select_alt  = { fg = "#ff6b6b", bg = "#1a1a1a" }
unset_main  = { fg = "#000000", bg = "#a8a8a8", bold = true }
unset_alt   = { fg = "#a8a8a8", bg = "#1a1a1a" }

[status]
progress_label = { fg = "#f0f0f0", bold = true }
progress_normal = { fg = "#e5383b", bg = "#2a2a2a" }
progress_error = { fg = "#ff6b6b", bg = "#2a2a2a" }

[tasks]
border = { fg = "#5c1a1a" }
hovered = { fg = "#000000", bg = "#c1121f" }

[filetype]
rules = [
  { mime = "image/*", fg = "#b3b3b3" },
  { mime = "video/*", fg = "#b3b3b3" },
  { mime = "audio/*", fg = "#b3b3b3" },
  { url = "*/", fg = "#e5383b" },
]
