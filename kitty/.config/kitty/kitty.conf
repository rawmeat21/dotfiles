# Font
font_family      JetBrainsMono Nerd Font
font_size        10.0
bold_font        auto
italic_font      auto

# Cursor
cursor                  #c0caf5
cursor_text_color       #0a0a0f
cursor_shape            block
cursor_blink_interval   0.5

# Colors
background              #0a0a0f
foreground              #c0caf5

# Black
color0                  #0d1117
color8                  #1e3a5f

# White
color7                  #a9b1d6
color15                 #c0caf5

# Accent (purple/cyan tones only)
color1                  #f7768e
color9                  #f7768e
color2                  #565f89
color10                 #565f89
color3                  #e0af68
color11                 #e0af68
color4                  #7b2fff
color12                 #00bfff
color5                  #9d7cd8
color13                 #bb9af7
color6                  #00bfff
color14                 #7dcfff

# Transparency
background_opacity      0.92

# No decorations
hide_window_decorations yes
