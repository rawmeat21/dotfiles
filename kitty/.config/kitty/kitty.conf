# Font
font_family      JetBrainsMono Nerd Font
font_size        10.0
bold_font        auto
italic_font      auto

# Cursor
cursor                  #e0e0e0
cursor_text_color       #000000
cursor_shape            block
cursor_blink_interval   0.5

# Base colors
background              #000000
foreground              #d0d0d0
selection_background    #333333
selection_foreground    #ffffff
url_color               #9a9a9a

# Window
background_opacity      0.75
window_padding_width    14
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell       no

# Splits / borders
active_border_color     #808080
inactive_border_color   #2a2a2a

# Black / white
color0                  #0a0a0a
color8                  #4d4d4d
color7                  #b3b3b3
color15                 #f0f0f0

# Accents: near-grayscale, only red/yellow/green keep a hint of color
color1                  #9c5a5a
color9                  #b87272
color2                  #6f8a6f
color10                 #8fa88f
color3                  #a89a6a
color11                 #c4b88a
color4                  #6e7a85
color12                 #8d99a4
color5                  #8a8a8a
color13                 #a8a8a8
color6                  #75857f
color14                 #95a5a0

# Tabs
tab_bar_style           separator
tab_separator           " "
active_tab_foreground   #f0f0f0
active_tab_background   #2a2a2a
inactive_tab_foreground #707070
inactive_tab_background #0a0a0a
